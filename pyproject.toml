[project]
name = "cognitive-persistence-agent"
version = "8.5.0"
description = "Agentic AI with deterministic cognitive persistence and a mutable artifact workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic==1.5.0",
  "docstring-parser==0.18.0",
  "fastapi==0.141.1",
  "google-genai==2.22.0",
  "lxml==6.1.3",
  "networkx==3.6.1",
  "openai==3.13.0",
  "openpyxl==3.1.5",
  "openrouter==1.1.96",
  "pydantic==2.12.5",
  "pypdf==6.16.2",
  "python-docx==1.2.0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "python-pptx==1.0.2",
  "pyyaml==6.0.3",
  "reportlab==5.0.1",
  "sqlite-vec==0.1.9",
  "streamlit==1.63.0",
  "streamlit-cookies-controller==0.0.4",
  "streamlit-pdf==2.0.1",
  "tree-sitter==0.21.3",
  "tree-sitter-languages==1.10.2",
  "uvicorn[standard]==0.52.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ragapp*"]
exclude = ["projects*"]

[project.scripts]
cognitive-agent = "ragapp.interfaces.launcher:main"
cognitive-streamlit = "ragapp.interfaces.streamlit_app.main:main"

[tool.uv]
package = true
